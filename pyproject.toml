[project]
name = "sparc2root"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "uproot>=5.7.7",
    "razorbill"
]

[tool.uv]
no-build-isolation-package = ["razorbill"]

[tool.uv.sources]
razorbill = { path = "../razorbill", editable = true }

[project.scripts]
sparc2root = "sparc2root.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparc2root"]
